<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Mission-Gated Decision Dashboard</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #f2f4f7;
    margin: 40px;
}

h1 { margin-bottom: 20px; }

/* Mission Gate */
.gate {
    background: white;
    padding: 25px;
    border-radius: 10px;
    display: inline-block;
    margin-bottom: 40px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    width: 500px;
}

.status {
    font-weight: bold;
    font-size: 18px;
    margin-top: 10px;
}

/* PHASE LAYOUT */
.phase-container {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.phase-column {
    background: white;
    padding: 15px;
    border-radius: 12px;
    flex: 1;
    min-width: 200px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    position: relative;
}

.phase-column h3 {
    margin-bottom: 15px;
}

/* Drop zone */
.drop-zone {
    flex-grow: 1;
    display: flex;
    flex-wrap: nowrap;
    gap: 10px;
    align-items: flex-start;
    justify-content: center; /* center cards */
    transition: background-color 0.2s ease;
    overflow-x: auto;
}

.drop-zone::-webkit-scrollbar {
    height: 6px;
}

.drop-zone::-webkit-scrollbar-thumb {
    background-color: rgba(0,0,0,0.2);
    border-radius: 3px;
}

/* Card */
.slider-box {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 90px;
    padding: 8px;
    background: #ffffff;
    border-radius: 8px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    min-height: 200px;
}

.slider-box:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
}

/* Vertical slider */
.slider-container {
    position: relative;
    height: 200px;
    width: 20px;
    margin-top: 10px;
}

.slider-track-overlay {
    position: absolute;
    top: 0;/*adjust the so that it alights with the center of the blue dot*/
    left: 9px; /* negative values make the hash marks appear further left */
    height: 100%;
    width: 6px;
    pointer-events: none;
    z-index: 2; /* put above the slider input */
}

.slider-tick {
    position: absolute;
    left: 0;
    width: 100%;
    height: 2px;
    background: #ccc;
}

/* Actual slider input */
.slider-box input[type=range] {
    -webkit-appearance: slider-vertical;
    writing-mode: bt-lr;
    height: 200px;
    width: 20px;
    position: relative;
    z-index: 1;
}

/* Label */
.label {
    margin-top: 10px;
    font-size: 14px;
    font-weight: bold;
    line-height: 1.2;
    text-align: center;
    height: 36px;
}

/* Value */
.value {
    margin-top: 5px;
    font-size: 12px;
    color: #444;
}

/* Disabled */
.disabled {
    opacity: 0.4;
    pointer-events: none;
}

/* Info button */
.info-btn {
    margin-top: 6px;
    font-size: 16px;
    cursor: pointer;
    color: #007bff;
    border: none;
    background: none;
    font-weight: bold;
}

.info-btn:hover { color: #0056b3; }

/* Modal */
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0; top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.5);
}

.modal-content {
    background: white;
    margin: 10% auto;
    padding: 20px;
    width: 500px;
    max-width: 90%;
    border-radius: 8px;
    text-align: left;
    position: relative;
    max-height: 70%;
    overflow-y: auto;
}

.close-btn {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

.close-btn:hover { color: red; }

/* Hide per-phase scores */
.phase-score {
    display: none;
}

/* Overall score styling */
#overallScore {
    display: block;
    margin-top: 40px;   /* more space below phases */
    font-weight: bold;
    font-size: 20px;
}
</style>
</head>

<body>

<h1>Mission-Gated Decision Dashboard</h1>

<div class="gate">
    <h2>
        Mission Fidelity (Hard Gate)
        <button class="info-btn" data-info="mission">ⓘ</button>
    </h2>

    <label>
        <input type="checkbox" id="missionToggle">
        Mission Positive / Neutral
    </label>

    <div class="status" id="gateStatus">⛔ NO GO</div>
</div>

<div class="phase-container">

  <div class="phase-column">
    <h3>Phase 1<br>Revenue Factors</h3>
    <div class="phase-score" id="phaseScore0">Score: 0</div>
    <div class="drop-zone"></div>
  </div>

  <div class="phase-column">
    <h3>Phase 2<br>Goodness of Fit</h3>
    <div class="phase-score" id="phaseScore1">Score: 0</div>
    <div class="drop-zone"></div>
  </div>

  <div class="phase-column">
    <h3>Phase 3<br>Optimize & Execute</h3>
    <div class="phase-score" id="phaseScore2">Score: 0</div>
    <div class="drop-zone"></div>
  </div>

</div>

<div id="overallScore">Overall Score: 0</div>

<!-- Modal -->
<div id="infoModal" class="modal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <div id="modalText"></div>
    </div>
</div>

<script>
const allowedValues = [1, 4, 7, 10];
const defaultWeight = 5;

/* ---------- MODAL ---------- */
const modal = document.getElementById("infoModal");
const modalText = document.getElementById("modalText");
const closeBtn = document.querySelector(".close-btn");

function openModal(text) {
    modalText.innerHTML = text.replace(/\n/g, "<br><br>");
    modal.style.display = "block";
}

closeBtn.onclick = () => modal.style.display = "none";
window.onclick = (event) => { if (event.target == modal) modal.style.display = "none"; };

/* ---------- MISSION GATE ---------- */
const toggle = document.getElementById("missionToggle");
const status = document.getElementById("gateStatus");
const zones = document.querySelectorAll(".drop-zone");

function updateGate() {
    const sliders = document.querySelectorAll(".slider");
    if (toggle.checked) {
        status.textContent = "✅ GO";
        status.style.color = "green";
        zones.forEach(z => z.classList.remove("disabled"));
        sliders.forEach(s => s.disabled = false);
    } else {
        status.textContent = "⛔ NO GO";
        zones.forEach(z => z.classList.add("disabled"));
        sliders.forEach(s => s.disabled = true);
    }
}
toggle.addEventListener("change", updateGate);

/* ---------- COLOR FUNCTION ---------- */
function getColorForValue(value, label) {
    const invertLabels = ["Time to Value", "Risk Profile", "Immediacy", "Cost to Deliver"];
    const invert = invertLabels.includes(label);
    if (invert) {
        switch (parseInt(value)) {
            case 1: return "#33cc33";
            case 4: return "#66cccc";
            case 7: return "#ffcc99";
            case 10: return "#ff4d4d";
            default: return "#ffffff";
        }
    } else {
        switch (parseInt(value)) {
            case 1: return "#ff4d4d";
            case 4: return "#ffcc99";
            case 7: return "#66cccc";
            case 10: return "#33cc33";
            default: return "#ffffff";
        }
    }
}

/* ---------- SLIDER CREATION ---------- */
function createSlider(labelText, infoText) {
    const box = document.createElement("div");
    box.className = "slider-box";

    box.dataset.weight = defaultWeight;

    const htmlLabel = labelText.replace(/\n/g, "<br>");
    box.innerHTML = `
        <div class="slider-container">
            <div class="slider-track-overlay">
                <div class="slider-tick" style="top: 0;"></div>
                <div class="slider-tick" style="top: 66.66px;"></div>
                <div class="slider-tick" style="top: 133.33px;"></div>
                <div class="slider-tick" style="top: 200px;"></div>
            </div>
            <input type="range" min="1" max="10" value="5" class="slider" step="any">
        </div>
        <div class="label">${htmlLabel}</div>
        <div class="value">5</div>
        <button class="info-btn">ⓘ</button>
    `;
    box.querySelector(".info-btn").dataset.text = infoText;
    box.style.backgroundColor = getColorForValue(5, labelText.trim());
    return box;
}

/* ---------- FULL INFORMATIONAL DATA ---------- */
const slidersData = {
    "Measurable Impact": `
        Measurable impact is not conceptual or subtle.
        An idea, project, or initiative should create effects that are visible, quantifiable, or clearly felt.
        Efforts that don’t leave a strong, measurable mark may need reevaluation.
        `,
     "Cost to Deliver": `
        Every initiative will require some effort in order to deliver it to the market.
        These costs should consider additional cash investment, time to build, opportunity costs of not working on another project.
        While we'd like to everything with low time to value, we may not be able to afford the upfront investment.
        `,
    "Time to Value": `
        Time to Value measures how quickly meaningful impact or financial return is realized.
        Every idea, project, or effort carries a cost; not just dollars, but time, attention, and focus.
        What is the projected break-even point in which we recoup our costs and begin improving net-revenue
        `,
    "Risk Profile": `
        How we manage risk is about seeing clearly, planning ahead, and protecting the mission.
        The goal is not to eliminate risk entirely; it’s to identify, anticipate, and mitigate.
        Risk Profile might include 
            • Development Risk Profile – budget, schedule, technical challenges.
            • Go-to-market Risk Profile – adoption hurdles, timing..
            • Competitive Risk Profile – rivals’ moves, market shifts.
            • Implementation Risk Profile – internal alignment, operational execution.
        `,
    "Revenue Potential": `
        Every initiative must justify its place in the portfolio. 
        What are the costs for each unit sold or program implemented (cost of deliver, cost of goods sold, etc).
        What are the potential upsides for the investment and effort?
        Marginal costs, marginal effort
        `,
    "Executional Fit": `
        Executional Fit gauges whether an initiative can realistically be delivered at a high standard.
        Consider the effort required, the skills of current staff, and past performance in similar initiatives.
        Can we execute this well, meet quality expectations, and serve our customers effectively?
        How well an initiative amplifies our unique strengths - our IP, expertise, and core capabilities.

        Executional Fit measures how well an initiative fits within the organization and moves forward smoothly.
        It reflects feedback from key teams to ensure decisions are integrated, resources are aligned, and execution is coordinated.
        It also considers whether current capabilities, processes, and business plans allow for iteration, adaptation, and improvement as needed.
        High organizational fit means the initiative can advance confidently; low fit signals friction or gaps that may slow or derail impact.
        `,
    "Market Opportunity": `
        market fit, current and future market potential, market trends/size, anticipated market
        Market Opportunity measures how well an initiative famplifies our unique strengths - our IP, expertise, and core capabilities.
        Does this project strengthen other initiatives, unlock technical advantages, or create opportunities competitors can’t easily replicate?
        `,
    "Immediacy": `
        Immediacy is more than dollars—it’s the investment of time, energy, focus, and resources.
        Before moving forward, consider:
            • What opportunities might we miss?
            • What advantages could competitors gain?
            • What impact might never happen?
        Understanding the full cost, including potential delays or decisions not made, helps ensure we invest wisely and protect our mission. 
        Cost is not a simple budget line; it is a debt of time, resources, focus, and revenue.
        `,
    "Success Metrics": `
        Success Metrics define how we know if an initiative is working—and when to take action.
        This includes tracking progress during development, pre-sales, and Deliver phases.
        Metrics answer questions like: Should we add resources or invest more? Is it time to pivot or pull the plug?
        `
};

/* ---------- PER-SLIDER, PER-VALUE DESCRIPTIONS ---------- */
const sliderValueDescriptions = {
  "Measurable Impact": {
    1: "Measurable Impact = 1: The impact is unkonwn and can't be felt. We don't have impact measures.",
    4: "Measurable Impact = 4: There is some noticeable change, but likely limited. Not a game changer for the mission nor the business",
    7: "Measurable Impact = 7: Significant measurable upside to the mission or the business.",
    10: "Measurable Impact = 10: Strong measurable impact on the mission or business. The impact is wide-reaching."
  },
  "Cost to Deliver": {
    1: "Cost to Deliver = 1: We can get this to market almost immediately.",
    4: "Cost to Deliver = 4: This costs about as much as building a new ST Math game",
    7: "Cost to Deliver = 7: Getting this to market is like building a new grade in InsightMath",
    10: "Cost to Deliver = 10: Getting this to market is likely building InsightMath from scratch"
  },
  
  "Time to Value": {
    1: "Time to Value = 1: Immediate benefits. Weeks, not months.",
    4: "Time to Value = 4: Short-term benefits. 3 to 6 months",
    7: "Time to Value = 7: Medium-term benefits. 9 - 12 months",
    10: "Time to Value = 10: Long-term benefits. Greater than 18 months"
  },
  "Risk Profile": {
    1: "Risk Profile = 1: Very low risk.",
    4: "Risk Profile = 4: Not too risky in the near term, but needs reevaluation in a year.",
    7: "Risk Profile = 7: Moderate risk. It's a long shot, but not impossible.",
    10: "Risk Profile = 10: High risk. This is outside our wheelhouse and largely unknown."
  },
  "Revenue Potential": {
    1: "Revenue Potential = 1: It won't hurt, but there's not much going on.",
    4: "Revenue Potential = 4: It will help some, but not a pillar of revenue",
    7: "Revenue Potential = 7: This is a game changer likely a year or so out",
    10: "Revenue Potential = 10: This is a game changer within 6 months."
  },
  "Executional Fit": {
    1: "Executional Fit = 1: Poor fit. This is not within our wheelhouse. It would require spinning up an entirely new arm and strategic fit is unclear.",
    4: "Executional Fit = 4: This fits mostly within existing staff skills, we can execute it well. ",
    7: "Executional Fit = 7: The idea fits all existing skills, offers room for ongoing iteration and versioning, and we can execute this well.",
    10: "Executional Fit = 10: This is or primary skill set across all teams and relies on our sole source advantages"
  },
  
  "Market Opportunity": {
    1: "Market Opportunity = 1: The market is small and likely shrinking, or our market fit is poor.",
    4: "Market Opportunity = 4: We'll do OK in smaller segments - likely only those sites or districts that value student experience above all else.",
    7: "Market Opportunity = 7: We have good fit with current and anticipated market trends",
    10: "Market Opportunity = 10: The market is strong, entering or expanding in this market is likely a game change for the mission or business"
  },
  "Immediacy": {
    1: "Immediacy = 1: The work can be done 12 or more months down the road.",
    4: "Immediacy = 4: The work can be done 6 to 9 months from now",
    7: "Immediacy = 7: The work can be done 3 to 6 months from now",
    10: "Immediacy = 10: The work should start immediately"
  },
  
  "Success Metrics": {
    1: "Success Metrics = 1: No clear metrics. Everything is a gut reaction.",
    4: "Success Metrics = 4: Limited or vague metrics, but a general sense that we'd know when to approve or kill the project",
    7: "Success Metrics = 7: Well-defined metrics are built and will help determine ongoing go/no-go decisions",
    10: "Success Metrics = 10: Comprehensive metrics are complete and approved."
  }
};

/* ---------- PREPOPULATE CARDS ---------- */
const phaseMapping = {
    0: ["Revenue Potential", "Time to Value", "Market Opportunity", "Measurable Impact"],
    1: ["Executional Fit","Risk Profile", "Cost to Deliver"],
    2: ["Immediacy", "Success Metrics"]
}; 

zones.forEach((zone, idx) => {
    phaseMapping[idx].forEach(label => {
        zone.appendChild(createSlider(label, slidersData[label]));
    });
});

updateGate();

/* ---------- SCORING ---------- */
const phaseWeights = [0.5, 0.3, 0.2];/* phase 1 work the most points and down from there*/
function calculateScores() {
    let overall = 0;

    // First, compute min/max for each phase
    const phaseScores = Array.from(zones).map((zone, phaseIdx) => {
        let phaseMin = 0;
        let phaseMax = 0;
        let phaseScore = 0;

        const sliders = zone.querySelectorAll(".slider-box input.slider");
        sliders.forEach(slider => {
            const val = parseInt(slider.value);
            const label = slider.parentElement.parentElement.querySelector(".label").textContent.trim();
            const weight = parseInt(slider.parentElement.parentElement.dataset.weight || defaultWeight);
            const invert = ["Time to Value", "Risk Profile", "Cost to Deliver"].includes(label);

            // Slider min/max depending on inverted
            const sliderMax = invert ? 10 * weight : 10 * weight;
            const sliderMin = invert ? 1 * weight : 1 * weight;

            // But invert flips contribution
            const contrib = invert ? (11 - val) * weight : val * weight;

            phaseScore += contrib;
            phaseMax += 10 * weight;
            phaseMin += 1 * weight;
        });

        return { phaseScore, phaseMin, phaseMax };
    });

    // Now normalize each phase between min and max
    phaseScores.forEach((p, phaseIdx) => {
        const normalized = Math.round(((p.phaseScore - p.phaseMin) / (p.phaseMax - p.phaseMin)) * 100);
        overall += normalized * phaseWeights[phaseIdx];
    });

    const overallPercent = Math.round(overall);
    document.getElementById("overallScore").textContent = `Overall Score: ${overallPercent}`;
}

/* ---------- SLIDER VALUE & COLOR UPDATE ---------- */
document.addEventListener("input", function(e) {
    if (e.target.classList.contains("slider")) {
        let nearest = allowedValues.reduce((prev, curr) => Math.abs(curr - e.target.value) < Math.abs(prev - e.target.value) ? curr : prev);
        e.target.value = nearest;
        e.target.parentElement.parentElement.querySelector(".value").textContent = nearest;
        const label = e.target.parentElement.parentElement.querySelector(".label").textContent.trim();
        e.target.parentElement.parentElement.style.backgroundColor = getColorForValue(nearest, label);
        calculateScores();
    }
});

// Add double-click listener on slider thumbs to show full description
document.querySelectorAll('.slider-box input[type=range]').forEach(slider => {
   slider.addEventListener('dblclick', () => {
    const box = slider.closest('.slider-box');
    const label = box.querySelector('.label').textContent.trim();
    const value = parseInt(slider.value);
    
    const text = (sliderValueDescriptions[label] && sliderValueDescriptions[label][value]) 
                 ? sliderValueDescriptions[label][value] 
                 : "No detailed description available.";

    openModal(text);
});
});

calculateScores();

/* ---------- INFO BUTTON ---------- */
document.addEventListener("click", function(e) {
    if (e.target.classList.contains("info-btn")) {
        let text = e.target.dataset.text;
        if (!text && e.target.dataset.info === "mission") {
            text = `
                Mission fidelity means staying true to why we exist.
                Every idea or project should either improve learning or help us scale our impact.
                While we pursue growth and revenue, it’s important to avoid initiatives that pull us off course.
                Think of this as a clear go/no-go checkpoint: if it doesn’t align, it doesn’t move forward.
                `;
        }
        openModal(text);
    }
});
</script>

</body>
</html>
