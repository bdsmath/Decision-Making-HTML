<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Mission-Gated Decision Dashboard</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #f2f4f7;
    margin: 40px;
}

h1 { margin-bottom: 20px; }

/* Mission Gate */
.gate {
    background: white;
    padding: 25px;
    border-radius: 10px;
    display: inline-block;
    margin-bottom: 40px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    width: 500px;
}

.status {
    font-weight: bold;
    font-size: 18px;
    margin-top: 10px;
}

/* Slider Board */
.board {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 20px;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.1);
}

/* Draggable card */
.slider-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 110px;
    padding: 10px;
    background: #ffffff;
    border-radius: 8px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    cursor: grab;
}

.slider-box:active { cursor: grabbing; }

.dragging { opacity: 0.4; }

/* Vertical slider */
.slider-box input[type=range] {
    -webkit-appearance: slider-vertical;
    writing-mode: bt-lr;
    height: 200px;
    width: 20px;
}

/* Label */
.label {
    margin-top: 10px;
    font-size: 14px;
    font-weight: bold;
    line-height: 1.2;
}

/* Value */
.value {
    margin-top: 5px;
    font-size: 12px;
    color: #444;
}

/* Disabled board */
.disabled {
    opacity: 0.4;
    pointer-events: none;
}

/* Info button */
.info-btn {
    margin-top: 6px;
    font-size: 16px;
    cursor: pointer;
    color: #007bff;
    border: none;
    background: none;
    font-weight: bold;
}

.info-btn:hover { color: #0056b3; }

/* Modal */
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0; top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.5);
}

.modal-content {
    background: white;
    margin: 10% auto;
    padding: 20px;
    width: 500px;
    max-width: 90%;
    border-radius: 8px;
    text-align: left;
    position: relative;
    max-height: 70%;
    overflow-y: auto;
}

.close-btn {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

.close-btn:hover { color: red; }

</style>
</head>

<body>

<h1>Mission-Gated Decision Dashboard</h1>

<div class="gate">
    <h2>
        Mission Fidelity (Hard Gate)
        <button class="info-btn" data-info="mission">ⓘ</button>
    </h2>

    <label>
        <input type="checkbox" id="missionToggle">
        Mission Positive / Neutral
    </label>

    <div class="status" id="gateStatus">⛔ NO GO</div>
</div>

<div class="board" id="sliderBoard"></div>

<!-- Modal -->
<div id="infoModal" class="modal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <div id="modalText"></div>
    </div>
</div>

<script>

/* ---------- MODAL LOGIC ---------- */

const modal = document.getElementById("infoModal");
const modalText = document.getElementById("modalText");
const closeBtn = document.querySelector(".close-btn");

function openModal(text) {
    modalText.innerHTML = text.replace(/\n/g, "<br><br>");
    modal.style.display = "block";
}

closeBtn.onclick = () => modal.style.display = "none";
window.onclick = (event) => {
    if (event.target == modal) modal.style.display = "none";
};

/* ---------- MISSION GATE ---------- */

const toggle = document.getElementById("missionToggle");
const status = document.getElementById("gateStatus");
const board = document.getElementById("sliderBoard");

function updateGate() {
    const sliders = document.querySelectorAll(".slider");
    if (toggle.checked) {
        status.textContent = "✅ GO";
        status.style.color = "green";
        board.classList.remove("disabled");
        sliders.forEach(s => s.disabled = false);
    } else {
        status.textContent = "⛔ NO GO";
        status.style.color = "red";
        board.classList.add("disabled");
        sliders.forEach(s => s.disabled = true);
    }
}
toggle.addEventListener("change", updateGate);

/* ---------- SLIDER CREATION ---------- */

function createSlider(labelText, infoText) {
    const box = document.createElement("div");
    box.className = "slider-box";
    box.draggable = true;

    box.innerHTML = `
        <input type="range" min="0" max="10" value="5" class="slider">
        <div class="label">${labelText}</div>
        <div class="value">5</div>
        <button class="info-btn">ⓘ</button>
    `;

    box.querySelector(".info-btn").dataset.text = infoText;

    return box;
}

const slidersData = [
["Measurable<br>Impact", `Impact is not conceptual or subtle.

The difference it creates should be visible or quantifiable.

Anything less than a measurable impact may be too tangential for our current needs.`],

["Mission<br>Cost", `Cost is not a simple budget line; it is a debt of time, resources, focus, and revenue.

• What opportunity will slip away?
• What ground will competitors seize?
• What impact will never materialize?

The cost to the mission includes omission, delay, or indecision.`],

["Time to<br>Value", `Time to Value measures how quickly meaningful impact or financial return is realized.`],

["Risks &<br>Mitigation", `Risk assesses likelihood and magnitude of downside.`],

["Marginal<br>Return", `Return measures projected upside relative to investment.`],

["Strategic<br>Leverage", `Strategic Leverage evaluates how well an initiative amplifies our unique strengths.`],

["Executional<br>Fit", `Executional Fit assesses our ability to deliver effectively.`],

["Success<br>Metrics", `Success Metrics define how performance will be measured.`],

["Organizational<br>Momentum", `Organizational Momentum measures internal alignment and energy.`]
];

slidersData.forEach(data => {
    board.appendChild(createSlider(data[0], data[1]));
});

updateGate();

/* ---------- SLIDER VALUE DISPLAY ---------- */

document.addEventListener("input", function(e) {
    if (e.target.classList.contains("slider")) {
        e.target.parentElement.querySelector(".value").textContent = e.target.value;
    }
});

/* ---------- DRAG & DROP ---------- */

let draggedItem = null;

board.addEventListener("dragstart", e => {
    if (e.target.classList.contains("slider-box")) {
        draggedItem = e.target;
        e.target.classList.add("dragging");
    }
});

board.addEventListener("dragend", e => {
    if (e.target.classList.contains("slider-box")) {
        e.target.classList.remove("dragging");
    }
});

board.addEventListener("dragover", e => {
    e.preventDefault();
    const afterElement = getDragAfterElement(board, e.clientX);
    if (afterElement == null) {
        board.appendChild(draggedItem);
    } else {
        board.insertBefore(draggedItem, afterElement);
    }
});

function getDragAfterElement(container, x) {
    const elements = [...container.querySelectorAll(".slider-box:not(.dragging)")];
    return elements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = x - box.left - box.width / 2;
        if (offset < 0 && offset > closest.offset) {
            return { offset: offset, element: child };
        } else {
            return closest;
        }
    }, { offset: Number.NEGATIVE_INFINITY }).element;
}

/* ---------- INFO BUTTON HANDLER ---------- */

document.addEventListener("click", function(e) {
    if (e.target.classList.contains("info-btn")) {

        let text = e.target.dataset.text;

        if (!text && e.target.dataset.info === "mission") {
            text = `
Fidelity to the mission means that anything outside the mission violates our reason to exist.

Ideas must improve learning or support the scaling of effectiveness.

As we seek revenue, we must protect against mission drift.

Mission fidelity is a go / no-go gate.
`;
        }

        openModal(text);
    }
});

</script>

</body>
</html>
